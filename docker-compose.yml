version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medscript-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-medscript-production-secret-key}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
    volumes:
      - medscript-storage:/app/uploads
      - medscript-sessions:/app/flask_session
      - medscript-db:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  medscript-storage:
  medscript-sessions:
  medscript-db:

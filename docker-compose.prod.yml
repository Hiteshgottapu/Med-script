version: '3.8'

services:
  web:
    image: ghcr.io/hiteshgottapu/med-script:latest
    container_name: medscript-production-app
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - medscript-storage:/app/uploads
      - medscript-sessions:/app/flask_session
      - medscript-db:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  medscript-storage:
    name: medscript_prod_storage
  medscript-sessions:
    name: medscript_prod_sessions
  medscript-db:
    name: medscript_prod_db

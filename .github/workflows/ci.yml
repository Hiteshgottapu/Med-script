name: MedScript CI / Test & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. CODE QUALITY & LINTING
  # ============================================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,.venv,env,flask_session,test_flask_session,__pycache__
          # Exit-zero treats all warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics \
            --exclude=venv,.venv,env,flask_session,test_flask_session,__pycache__

  # ============================================================
  # 2. SECURITY & DEPENDENCY AUDIT
  # ============================================================
  security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit (Static Application Security Testing)
        run: |
          bandit -r blueprints services core app.py config.py -ll -ii \
            -x tests,test_flask_session,flask_session || true

      - name: Audit Dependencies for Known CVEs
        run: |
          pip-audit -r requirements.txt || true

  # ============================================================
  # 3. AUTOMATED TEST MATRIX
  # ============================================================
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpq-dev \
            poppler-utils

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key-for-automated-pipeline-testing-12345
          SUPABASE_URL: https://mock-ci-project.supabase.co
          SUPABASE_KEY: mock-ci-anon-key-for-test-suite
        run: |
          mkdir -p junit
          pytest tests/ -v --tb=short --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml

  # ============================================================
  # 4. DOCKER BUILD & CONTAINER HEALTH PROBE
  # ============================================================
  docker-verify:
    name: Docker Build & Health Verification
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: medscript:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Startup & Healthcheck
        run: |
          docker run -d --name medscript-app -p 5000:5000 \
            -e FLASK_ENV=testing \
            -e SECRET_KEY=ci-test-secret-key-32-chars-min-len! \
            medscript:ci-test

          echo "Waiting for container to start..."
          for i in {1..15}; do
            if curl -s -f http://localhost:5000/health; then
              echo "Healthcheck successfully passed!"
              docker stop medscript-app
              docker rm medscript-app
              exit 0
            fi
            sleep 2
          done

          echo "Healthcheck failed to respond within 30 seconds"
          docker logs medscript-app
          docker stop medscript-app
          docker rm medscript-app
          exit 1
